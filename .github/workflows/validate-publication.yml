name: Validate Publication

on:
  pull_request:
    paths: ['latest/**', 'legacy/**', 'assets/**', '*.html', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-index-history.mjs
      - run: node scripts/build-pages.mjs
