<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documenti ufficiali esposti</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/official-docs.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div class="brand">
          <img src="favicon.ico" alt="CIMA" class="brand-icon" />
          <div>
            <h1>Lista Documenti ufficiali esposti</h1>
            <p>Vista file pubblici da cartella root <code>latest/</code>.</p>
          </div>
        </div>
        <nav class="quick-links" aria-label="Link utili">
          <a href="assets/latest-index.json" target="_blank" rel="noopener">Apri indice JSON</a>
          <a href="latest/" target="_blank" rel="noopener">Apri cartella latest</a>
          <a data-link-key="webtermsAppUrl" target="_blank" rel="noopener">Apri web app WebTerms</a>
          <a data-link-key="legalPublicRepoUrl" target="_blank" rel="noopener">Apri repository legal-public-docs</a>
        </nav>
      </header>

      <section class="card">
        <div id="status" class="status">Caricamento indice...</div>
        <div class="filters" aria-label="Filtri">
          <label class="filter-item">
            <span>Linea</span>
            <select id="filter-line">
              <option value="">tutte</option>
            </select>
          </label>
          <label class="filter-item">
            <span>Lingua</span>
            <select id="filter-lang">
              <option value="">tutte</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table aria-describedby="status">
            <thead>
              <tr>
                <th>Linea</th>
                <th>Tipo</th>
                <th>Lingua</th>
                <th>Data</th>
                <th>PDF pubblico</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="assets/site-links.js"></script>
    <script src="assets/official-docs.js"></script>
  </body>
</html>
